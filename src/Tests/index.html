<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>ButterflyGraph Test</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            color: white;
            background: black;
        }

        button {
            background: #222;
            border: none;
            border-bottom: 2px solid grey;
            color: white;
            width: 100%;
            font-size: 18px;
            text-align: left;
        }

        label {
            display: flex;
            flex-direction: column;
            background: #222;
            font-size: 14px;
            border-bottom: 2px solid grey;
        }

        canvas {
            display: block; /** 余白を消す マジで数十分沼ったし2回ブラウザを殺した **/
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 上部ツールバー */
        #toolbar {
            display: flex;
            gap: 8px;
            padding: 8px;
            border-bottom: 2px solid grey;
        }

        #fps-display, #dpi-display {
            font-family: 'MS UI Gothic', 'Courier New', monospace;
            width: 100px;
        }

        /* メインエリア */
        #main {
            display: flex;
            flex: 1;
        }

        #tests-list {
            width: 200px;
            border-right: 2px solid grey;
            overflow-y: auto;
            contain: strict;
        }

        #control-area {
            width: 300px;
            border-right: 2px solid grey;
            overflow-y: auto;
            contain: strict;
        }

        #test-area {
            flex: 1;
        }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><text x='12' y='12' text-anchor='middle' dominant-baseline='central'>🦋</text></svg>" />
</head>

<body>
    <div id="app">
        <!-- 上部 -->
        <div id="toolbar">
            <!-- いったん未実装とする -->
            <!-- <input id="time-input" type="time" /> -->
            <label id="speed-label" for="speed-slider">Speed: 1.0x</label>
            <input id="speed-slider" type="range" min="-1" max="5" step="0.1" value="1" />
            <div id="fps-display">FPS: -- / --</div>
            <div id="dpi-display">DPI: 1.00x</div>
            <input id="background-color-picker" type="color" />
        </div>

        <!-- 下部 -->
        <div id="main">
            <div id="tests-list">
            </div>
            <div id="control-area">
            </div>
            <div id="test-area">
            </div>
        </div>
    </div>
    <script src="./main.js" type="module"></script>
</body>

</html>
